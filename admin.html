<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Hyd's Kitchen Wizards</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Segoe UI', sans-serif; }
body {
    background: #0f0f1e;
    color: #f8f9fa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    line-height: 1.6;
}
.login-box {
    background: linear-gradient(145deg, #1e1e3a, #16162c);
    padding: 3rem 2rem;
    border-radius: 24px;
    width: 100%;
    max-width: 420px;
    border: 1px solid rgba(255, 107, 53, 0.3);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
}
.login-logo {
    width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
    margin: 0 auto 1.5rem; display: block;
    border: 3px solid #ff6b35;
    box-shadow: 0 0 30px rgba(255, 107, 53, 0.5);
    background: white;
}
h1 {
    text-align: center; font-size: 1.5rem; margin-bottom: 0.5rem;
    background: linear-gradient(135deg, #ff6b35 0%, #f7c548 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.subtitle { text-align: center; color: #b8b8d1; font-size: 0.9rem; margin-bottom: 2rem; }
.form-group { margin-bottom: 1.2rem; }
.form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #c8c8d8; font-weight: 500; }
.form-group input {
    width: 100%; padding: 0.9rem 1.2rem;
    background: rgba(15, 15, 30, 0.6);
    border: 1px solid rgba(255, 107, 53, 0.3);
    border-radius: 12px; color: #f8f9fa;
    font-size: 1rem; outline: none;
    font-family: inherit;
}
.form-group input:focus { border-color: #ff6b35; box-shadow: 0 0 20px rgba(255, 107, 53, 0.3); }
.login-btn {
    width: 100%; padding: 1rem;
    background: linear-gradient(135deg, #ff6b35 0%, #f7c548 100%);
    color: white; border: none; border-radius: 12px;
    font-weight: 700; font-size: 1rem; cursor: pointer;
    margin-top: 0.5rem; font-family: inherit;
}
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.error-msg {
    background: rgba(220, 53, 69, 0.2); color: #ff6b6b;
    padding: 0.8rem 1rem; border-radius: 10px;
    font-size: 0.9rem; margin-top: 1rem;
    display: none; border-left: 3px solid #dc3545;
}
.error-msg.show { display: block; }
.info-box {
    background: rgba(23, 162, 184, 0.15); color: #5bc0de;
    padding: 0.8rem 1rem; border-radius: 10px;
    font-size: 0.8rem; margin-top: 1rem;
    border-left: 3px solid #17a2b8;
}
</style>
</head>
<body>

<div class="login-box">
    <img src="https://i.ibb.co/FbBXncPs/1000044382.jpg" alt="Logo" class="login-logo">
    <h1>Admin Login</h1>
    <p class="subtitle">Hyd's Kitchen Wizards Dashboard</p>
    
    <form id="loginForm" onsubmit="return false;">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="admin@example.com" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="button" class="login-btn" id="loginBtn" onclick="doLogin()">🔐 Login</button>
        <div class="error-msg" id="loginError"></div>
        <div class="info-box" id="infoBox">⏳ Loading...</div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL = 'https://lxqyiokavimwqkvdklnd.supabase.co';
var SUPABASE_KEY = 'sb_publishable_ze9HeMDOxQk_8TIkoSBvqA_Q8QcWxFD';

var supabaseClient = null;

window.addEventListener('load', function() {
    var infoBox = document.getElementById('infoBox');
    
    if (typeof window.supabase === 'undefined') {
        infoBox.style.background = 'rgba(220, 53, 69, 0.2)';
        infoBox.style.color = '#ff6b6b';
        infoBox.innerHTML = '❌ Supabase library load nahi hui. Internet check karein.';
        return;
    }
    
    try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        infoBox.innerHTML = '✅ Supabase connected. Login karein.';
        
        supabaseClient.auth.getSession().then(function(res) {
            if (res.data && res.data.session) {
                window.location.href = 'admin-dashboard.html';
            }
        });
    } catch(e) {
        infoBox.style.background = 'rgba(220, 53, 69, 0.2)';
        infoBox.style.color = '#ff6b6b';
        infoBox.innerHTML = '❌ Error: ' + e.message;
    }
});

async function doLogin() {
    var btn = document.getElementById('loginBtn');
    var errorBox = document.getElementById('loginError');
    var infoBox = document.getElementById('infoBox');
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    
    errorBox.classList.remove('show');
    
    if (!email || !password) {
        errorBox.textContent = '❌ Email aur password dono bharein';
        errorBox.classList.add('show');
        return;
    }
    
    if (!supabaseClient) {
        errorBox.textContent = '❌ Supabase connect nahi hai. Page reload karein.';
        errorBox.classList.add('show');
        return;
    }
    
    btn.disabled = true;
    btn.textContent = '⏳ Logging in...';
    infoBox.innerHTML = '⏳ Checking credentials...';
    
    try {
        var result = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });
        
        if (result.error) {
            errorBox.textContent = '❌ ' + result.error.message;
            errorBox.classList.add('show');
            infoBox.innerHTML = '❌ Login failed';
            btn.disabled = false;
            btn.textContent = '🔐 Login';
            return;
        }
        
        infoBox.innerHTML = '✅ Login successful! Redirecting...';
        btn.textContent = '✅ Success!';
        
        setTimeout(function() {
            window.location.href = 'admin-dashboard.html';
        }, 500);
        
    } catch(e) {
        errorBox.textContent = '❌ Error: ' + e.message;
        errorBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = '🔐 Login';
    }
}
</script>

</body>
</html>
