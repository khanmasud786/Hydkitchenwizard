<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Hyd's Kitchen Wizards</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Segoe UI', sans-serif; }

:root {
    --primary: #ff6b35;
    --secondary: #f7c548;
    --dark: #1a1a2e;
    --darker: #0f0f1e;
    --card: #1e1e3a;
    --light: #f8f9fa;
    --gray: #6c757d;
    --gradient: linear-gradient(135deg, #ff6b35 0%, #f7c548 100%);
    --success: #28a745;
    --danger: #dc3545;
    --info: #17a2b8;
}

body {
    background: var(--darker);
    color: var(--light);
    min-height: 100vh;
    line-height: 1.6;
}

/* ===== LOGIN PAGE ===== */
.login-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: radial-gradient(circle at 20% 50%, rgba(255, 107, 53, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(247, 197, 72, 0.15) 0%, transparent 50%);
}

.login-box {
    background: linear-gradient(145deg, #1e1e3a, #16162c);
    padding: 3rem 2rem;
    border-radius: 24px;
    width: 100%;
    max-width: 420px;
    border: 1px solid rgba(255, 107, 53, 0.3);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
}

.login-logo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 1.5rem;
    display: block;
    border: 3px solid var(--primary);
    box-shadow: 0 0 30px rgba(255, 107, 53, 0.5);
    background: white;
}

.login-box h1 {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.login-box p {
    text-align: center;
    color: #b8b8d1;
    font-size: 0.9rem;
    margin-bottom: 2rem;
}

.form-group {
    margin-bottom: 1.2rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
    color: #c8c8d8;
    font-weight: 500;
}

.form-group input {
    width: 100%;
    padding: 0.9rem 1.2rem;
    background: rgba(15, 15, 30, 0.6);
    border: 1px solid rgba(255, 107, 53, 0.3);
    border-radius: 12px;
    color: var(--light);
    font-size: 1rem;
    outline: none;
    transition: all 0.3s ease;
    font-family: inherit;
}

.form-group input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
}

.login-btn {
    width: 100%;
    padding: 1rem;
    background: var(--gradient);
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 0.5rem;
}

.login-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 15px 40px rgba(255, 107, 53, 0.5);
}

.login-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.error-msg {
    background: rgba(220, 53, 69, 0.2);
    color: #ff6b6b;
    padding: 0.8rem 1rem;
    border-radius: 10px;
    font-size: 0.9rem;
    margin-top: 1rem;
    display: none;
    border-left: 3px solid var(--danger);
}

.error-msg.show { display: block; }

/* ===== DASHBOARD ===== */
.dashboard { display: none; min-height: 100vh; }
.dashboard.active { display: block; }
.login-container.hidden { display: none; }

.admin-header {
    background: rgba(8, 8, 18, 0.95);
    backdrop-filter: blur(20px);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 107, 53, 0.25);
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
    gap: 1rem;
}

.admin-header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.admin-header-left img {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--primary);
    background: white;
}

.admin-header-left h1 {
    font-size: 1.2rem;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.admin-header-right {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.user-email {
    color: #b8b8d1;
    font-size: 0.9rem;
    display: none;
}

.logout-btn {
    padding: 0.6rem 1.2rem;
    background: rgba(220, 53, 69, 0.2);
    color: #ff6b6b;
    border: 1px solid rgba(220, 53, 69, 0.4);
    border-radius: 50px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.3s ease;
}

.logout-btn:hover {
    background: var(--danger);
    color: white;
}

.admin-tabs {
    display: flex;
    gap: 0.5rem;
    padding: 1rem 2rem;
    background: rgba(8, 8, 18, 0.5);
    border-bottom: 1px solid rgba(255, 107, 53, 0.15);
    overflow-x: auto;
    white-space: nowrap;
}

.admin-tabs::-webkit-scrollbar { height: 4px; }
.admin-tabs::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

.tab-btn {
    padding: 0.7rem 1.5rem;
    background: transparent;
    color: #b8b8d1;
    border: 1px solid transparent;
    border-radius: 50px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.3s ease;
    white-space: nowrap;
}

.tab-btn:hover {
    color: var(--primary);
    background: rgba(255, 107, 53, 0.1);
}

.tab-btn.active {
    background: var(--gradient);
    color: white;
    border-color: transparent;
}

.admin-content {
    padding: 2rem;
    max-width: 1400px;
    margin: 0 auto;
}

.tab-panel { display: none; }
.tab-panel.active { display: block; }

.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    gap: 1rem;
}

.panel-header h2 {
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.add-btn {
    padding: 0.8rem 1.5rem;
    background: var(--gradient);
    color: white;
    border: none;
    border-radius: 50px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.95rem;
}

.add-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(255, 107, 53, 0.5);
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
}

.stat-card {
    background: linear-gradient(145deg, #1e1e3a, #16162c);
    padding: 1.5rem;
    border-radius: 18px;
    border: 1px solid rgba(255, 107, 53, 0.2);
    transition: all 0.3s ease;
}

.stat-card:hover {
    transform: translateY(-4px);
    border-color: var(--primary);
    box-shadow: 0 15px 40px rgba(255, 107, 53, 0.3);
}

.stat-card .stat-icon {
    font-size: 2rem;
    margin-bottom: 0.5rem;
}

.stat-card h3 {
    font-size: 2rem;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 800;
}

.stat-card p {
    color: #b8b8d1;
    font-size: 0.9rem;
}

.data-table {
    width: 100%;
    background: linear-gradient(145deg, #1e1e3a, #16162c);
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(255, 107, 53, 0.15);
}

.data-table table {
    width: 100%;
    border-collapse: collapse;
}

.data-table th {
    background: rgba(255, 107, 53, 0.1);
    color: var(--primary);
    padding: 1rem;
    text-align: left;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
}

.data-table td {
    padding: 1rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    font-size: 0.9rem;
    color: #d8d8e8;
}

.data-table tr:last-child td { border-bottom: none; }

.data-table tr:hover td { background: rgba(255, 107, 53, 0.05); }

.action-btns {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.action-btn {
    padding: 0.4rem 0.9rem;
    border: none;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

.edit-btn {
    background: rgba(23, 162, 184, 0.2);
    color: var(--info);
    border: 1px solid rgba(23, 162, 184, 0.4);
}

.edit-btn:hover {
    background: var(--info);
    color: white;
}

.delete-btn {
    background: rgba(220, 53, 69, 0.2);
    color: #ff6b6b;
    border: 1px solid rgba(220, 53, 69, 0.4);
}

.delete-btn:hover {
    background: var(--danger);
    color: white;
}

.empty-state {
    padding: 3rem;
    text-align: center;
    color: var(--gray);
}

.empty-state .icon { font-size: 4rem; margin-bottom: 1rem; }

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(10px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    overflow-y: auto;
}

.modal.active { display: flex; }

.modal-content {
    background: linear-gradient(145deg, #1e1e3a, #16162c);
    border-radius: 24px;
    padding: 2rem;
    width: 100%;
    max-width: 600px;
    border: 1px solid rgba(255, 107, 53, 0.3);
    max-height: 90vh;
    overflow-y: auto;
    margin: auto;
}

.modal-content h3 {
    font-size: 1.3rem;
    margin-bottom: 1.5rem;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.modal-btns {
    display: flex;
    gap: 1rem;
    margin-top: 1.5rem;
    justify-content: flex-end;
    flex-wrap: wrap;
}

.btn {
    padding: 0.8rem 1.5rem;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.3s ease;
}

.btn-cancel {
    background: rgba(108, 117, 125, 0.2);
    color: #b8b8d1;
    border: 1px solid rgba(108, 117, 125, 0.4);
}

.btn-cancel:hover { background: var(--gray); color: white; }

.btn-save {
    background: var(--gradient);
    color: white;
}

.btn-save:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(255, 107, 53, 0.5);
}

.loading {
    text-align: center;
    padding: 3rem;
    color: var(--primary);
}

.spinner {
    display: inline-block;
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255, 107, 53, 0.3);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 768px) {
    .admin-header { padding: 1rem; }
    .admin-content { padding: 1rem; }
    .admin-tabs { padding: 1rem; }
    .panel-header h2 { font-size: 1.2rem; }
    .data-table { overflow-x: auto; display: block; }
    .data-table table { min-width: 600px; }
    .modal-content { padding: 1.5rem; }
    .login-box { padding: 2rem 1.5rem; }
}
</style>
</head>
<body>

<!-- ===== LOGIN PAGE ===== -->
<div class="login-container" id="loginContainer">
    <div class="login-box">
        <img src="https://i.ibb.co/bMg7cZsJ/Screenshot-20260913-092657-Instagram.jpg" alt="Logo" class="login-logo">
        <h1>Admin Login</h1>
        <p>Hyd's Kitchen Wizards Dashboard</p>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="admin@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">🔐 Login</button>
            <div class="error-msg" id="loginError"></div>
        </form>
    </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div class="dashboard" id="dashboard">
    <div class="admin-header">
        <div class="admin-header-left">
            <img src="https://i.ibb.co/bMg7cZsJ/Screenshot-20260913-092657-Instagram.jpg" alt="Logo">
            <h1>Admin Dashboard</h1>
        </div>
        <div class="admin-header-right">
            <span class="user-email" id="userEmail"></span>
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>
    </div>

    <div class="admin-tabs">
        <button class="tab-btn active" onclick="switchTab('overview', this)">📊 Overview</button>
        <button class="tab-btn" onclick="switchTab('recipes', this)">🍽️ Recipes</button>
        <button class="tab-btn" onclick="switchTab('playlists', this)">🎬 Playlists</button>
        <button class="tab-btn" onclick="switchTab('subscribers', this)">📩 Subscribers</button>
        <button class="tab-btn" onclick="switchTab('settings', this)">⚙️ Settings</button>
    </div>

    <div class="admin-content">

        <div class="tab-panel active" id="panel-overview">
            <div class="panel-header">
                <h2>📊 Dashboard Overview</h2>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">🍽️</div>
                    <h3 id="statRecipes">0</h3>
                    <p>Total Recipes</p>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎬</div>
                    <h3 id="statPlaylists">0</h3>
                    <p>Total Playlists</p>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📩</div>
                    <h3 id="statSubscribers">0</h3>
                    <p>Subscribers</p>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⚙️</div>
                    <h3 id="statSettings">0</h3>
                    <p>Settings</p>
                </div>
            </div>
        </div>

        <div class="tab-panel" id="panel-recipes">
            <div class="panel-header">
                <h2>🍽️ Manage Recipes</h2>
                <button class="add-btn" onclick="openRecipeModal()">➕ Add Recipe</button>
            </div>
            <div class="data-table" id="recipesTable">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>

        <div class="tab-panel" id="panel-playlists">
            <div class="panel-header">
                <h2>🎬 Manage Playlists</h2>
                <button class="add-btn" onclick="openPlaylistModal()">➕ Add Playlist</button>
            </div>
            <div class="data-table" id="playlistsTable">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>

        <div class="tab-panel" id="panel-subscribers">
            <div class="panel-header">
                <h2>📩 Newsletter Subscribers</h2>
            </div>
            <div class="data-table" id="subscribersTable">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>

        <div class="tab-panel" id="panel-settings">
            <div class="panel-header">
                <h2>⚙️ Website Settings</h2>
            </div>
            <div class="data-table" id="settingsTable">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </div>
</div>

<!-- ===== RECIPE MODAL ===== -->
<div class="modal" id="recipeModal">
    <div class="modal-content">
        <h3 id="recipeModalTitle">Add New Recipe</h3>
        <form id="recipeForm">
            <input type="hidden" id="recipeId">
            <div class="form-group">
                <label>Emoji</label>
                <input type="text" id="recipeEmoji" placeholder="🍛" maxlength="5">
            </div>
            <div class="form-group">
                <label>Recipe Name *</label>
                <input type="text" id="recipeName" placeholder="Hyderabadi Biryani" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="recipeDesc" placeholder="Short description">
            </div>
            <div class="form-group">
                <label>Badge</label>
                <input type="text" id="recipeBadge" placeholder="🔥 Trending">
            </div>
            <div class="form-group">
                <label>Time</label>
                <input type="text" id="recipeTime" placeholder="60 min">
            </div>
            <div class="form-group">
                <label>Rating</label>
                <input type="text" id="recipeRating" placeholder="4.9">
            </div>
            <div class="form-group">
                <label>YouTube Search Query *</label>
                <input type="text" id="recipeQuery" placeholder="hyderabadi chicken biryani" required>
            </div>
            <div class="modal-btns">
                <button type="button" class="btn btn-cancel" onclick="closeModal('recipeModal')">Cancel</button>
                <button type="submit" class="btn btn-save">💾 Save</button>
            </div>
        </form>
    </div>
</div>

<!-- ===== PLAYLIST MODAL ===== -->
<div class="modal" id="playlistModal">
    <div class="modal-content">
        <h3 id="playlistModalTitle">Add New Playlist</h3>
        <form id="playlistForm">
            <input type="hidden" id="playlistId">
            <div class="form-group">
                <label>Emoji</label>
                <input type="text" id="playlistEmoji" placeholder="🍛" maxlength="5">
            </div>
            <div class="form-group">
                <label>Playlist Name *</label>
                <input type="text" id="playlistName" placeholder="Biryani Recipes" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="playlistDesc" placeholder="Short description">
            </div>
            <div class="form-group">
                <label>YouTube Playlist URL *</label>
                <input type="url" id="playlistUrl" placeholder="https://youtube.com/playlist?list=..." required>
            </div>
            <div class="form-group">
                <label>Badge</label>
                <input type="text" id="playlistBadge" placeholder="🍛 Biryani">
            </div>
            <div class="form-group">
                <label>Count Label</label>
                <input type="text" id="playlistCount" placeholder="Biryani Collection">
            </div>
            <div class="modal-btns">
                <button type="button" class="btn btn-cancel" onclick="closeModal('playlistModal')">Cancel</button>
                <button type="submit" class="btn btn-save">💾 Save</button>
            </div>
        </form>
    </div>
</div>

<script>
// ===== SUPABASE SETUP (SAHI URL) =====
const SUPABASE_URL = 'https://lxqyiokavimwqkvdkIind.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ze9HeMDOxQk_8TIkoSBvqA_Q8QcWxFD';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ===== AUTH CHECK =====
window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
        showDashboard(session.user.email);
    }
});

// ===== LOGIN =====
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errorBox = document.getElementById('loginError');
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    
    btn.disabled = true;
    btn.textContent = '⏳ Logging in...';
    errorBox.classList.remove('show');
    
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    
    if (error) {
        errorBox.textContent = '❌ ' + error.message;
        errorBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = '🔐 Login';
        return;
    }
    
    showDashboard(data.user.email);
});

// ===== SHOW DASHBOARD =====
async function showDashboard(email) {
    document.getElementById('loginContainer').classList.add('hidden');
    document.getElementById('dashboard').classList.add('active');
    document.getElementById('userEmail').textContent = email;
    document.getElementById('userEmail').style.display = 'inline';
    await loadAllData();
}

// ===== LOGOUT =====
async function logout() {
    await supabase.auth.signOut();
    location.reload();
}

// ===== TAB SWITCHING =====
function switchTab(tabName, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + tabName).classList.add('active');
    
    if (tabName === 'recipes') loadRecipes();
    if (tabName === 'playlists') loadPlaylists();
    if (tabName === 'subscribers') loadSubscribers();
    if (tabName === 'settings') loadSettings();
}

// ===== LOAD ALL DATA =====
async function loadAllData() {
    await Promise.all([loadStats(), loadRecipes(), loadPlaylists(), loadSubscribers(), loadSettings()]);
}

// ===== STATS =====
async function loadStats() {
    const [r, p, s, st] = await Promise.all([
        supabase.from('recipes').select('id', { count: 'exact', head: true }),
        supabase.from('playlists').select('id', { count: 'exact', head: true }),
        supabase.from('subscribers').select('id', { count: 'exact', head: true }),
        supabase.from('settings').select('id', { count: 'exact', head: true })
    ]);
    document.getElementById('statRecipes').textContent = r.count || 0;
    document.getElementById('statPlaylists').textContent = p.count || 0;
    document.getElementById('statSubscribers').textContent = s.count || 0;

// ===== RECIPES =====
async function loadRecipes() {
    const { data, error } = await supabase.from('recipes').select('*').order('sort_order', { ascending: true });
    const container = document.getElementById('recipesTable');
    
    if (error || !data || data.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">🍽️</div><p>No recipes yet. Click "Add Recipe" to start!</p></div>';
        return;
    }
    
    container.innerHTML = `
        <table>
            <thead>
                <tr>
                    <th>Emoji</th>
                    <th>Name</th>
                    <th>Badge</th>
                    <th>Time</th>
                    <th>Rating</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                ${data.map(r => `
                    <tr>
                        <td style="font-size:1.5rem;">${r.emoji || '🍽️'}</td>
                        <td><strong>${r.name}</strong></td>
                        <td>${r.badge || '-'}</td>
                        <td>${r.time || '-'}</td>
                        <td>⭐ ${r.rating || '-'}</td>
                        <td>
                            <div class="action-btns">
                                <button class="action-btn edit-btn" onclick='editRecipe(${JSON.stringify(r).replace(/'/g, "&#39;")})'>✏️ Edit</button>
                                <button class="action-btn delete-btn" onclick="deleteRecipe(${r.id}, '${r.name.replace(/'/g, "\\'")}')">🗑️ Delete</button>
                            </div>
                        </td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}

function openRecipeModal(recipe = null) {
    const modal = document.getElementById('recipeModal');
    const form = document.getElementById('recipeForm');
    form.reset();
    document.getElementById('recipeId').value = '';
    document.getElementById('recipeModalTitle').textContent = 'Add New Recipe';
    
    if (recipe) {
        document.getElementById('recipeModalTitle').textContent = 'Edit Recipe';
        document.getElementById('recipeId').value = recipe.id;
        document.getElementById('recipeEmoji').value = recipe.emoji || '';
        document.getElementById('recipeName').value = recipe.name || '';
        document.getElementById('recipeDesc').value = recipe.description || '';
        document.getElementById('recipeBadge').value = recipe.badge || '';
        document.getElementById('recipeTime').value = recipe.time || '';
        document.getElementById('recipeRating').value = recipe.rating || '';
        document.getElementById('recipeQuery').value = recipe.query || '';
    }
    
    modal.classList.add('active');
}

function editRecipe(recipe) { openRecipeModal(recipe); }

document.getElementById('recipeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('recipeId').value;
    const data = {
        emoji: document.getElementById('recipeEmoji').value || '🍽️',
        name: document.getElementById('recipeName').value,
        description: document.getElementById('recipeDesc').value,
        badge: document.getElementById('recipeBadge').value,
        time: document.getElementById('recipeTime').value,
        rating: document.getElementById('recipeRating').value,
        query: document.getElementById('recipeQuery').value
    };
    
    let result;
    if (id) {
        result = await supabase.from('recipes').update(data).eq('id', id);
    } else {
        result = await supabase.from('recipes').insert([data]);
    }
    
    if (result.error) {
        alert('❌ Error: ' + result.error.message);
        return;
    }
    
    closeModal('recipeModal');
    await loadRecipes();
    await loadStats();
});

async function deleteRecipe(id, name) {
    if (!confirm(`Delete recipe "${name}"?`)) return;
    const { error } = await supabase.from('recipes').delete().eq('id', id);
    if (error) { alert('❌ Error: ' + error.message); return; }
    await loadRecipes();
    await loadStats();
}

// ===== SETTINGS =====
async function loadSettings() {
    const { data, error } = await supabase.from('settings').select('*').order('id', { ascending: true });
    const container = document.getElementById('settingsTable');
    
    if (error || !data || data.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">⚙️</div><p>No settings found.</p></div>';
        return;
    }
    
    container.innerHTML = `
        <table>
            <thead>
                <tr><th>Key</th><th>Value</th><th>Action</th></tr>
            </thead>
            <tbody>
                ${data.map(s => `
                    <tr>
                        <td><strong>${s.key}</strong></td>
                        <td>
                            <input type="text" value="${s.value || ''}" id="setting-${s.id}" 
                                   style="background: rgba(15,15,30,0.6); border: 1px solid rgba(255,107,53,0.3); 
                                          border-radius: 8px; padding: 0.5rem; color: white; width: 100%; max-width: 400px;">
                        </td>
                        <td>
                            <button class="action-btn edit-btn" onclick="saveSetting(${s.id})">💾 Save</button>
                        </td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}

async function saveSetting(id) {
    const value = document.getElementById('setting-' + id).value;
    const { error } = await supabase.from('settings').update({ value }).eq('id', id);
    if (error) { alert('❌ Error: ' + error.message); return; }
    alert('✅ Setting saved!');
}

// ===== MODAL CLOSE =====
function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

document.querySelectorAll('.modal').forEach(modal => {
    modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('active');
    });
});
